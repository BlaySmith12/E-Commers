<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Order On Hold</title></head>
<body style="margin:0;padding:0;background-color:#F6F9F9;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F6F9F9;">
<tr><td align="center" style="padding:30px 15px;">
<table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
<tr><td style="background-color:#121010;padding:30px 40px;text-align:center;border-radius:8px 8px 0 0;">
<img src="{{ store_url }}/static/images/logo.png" alt="{{ store_name }}" width="170" style="display:inline-block;max-width:200px;width:170px;height:auto;border:0;">
</td></tr>

<tr><td style="background-color:#ffffff;padding:40px;">
<div style="text-align:center;margin:0 0 25px;">
<div style="width:60px;height:60px;border-radius:50%;background-color:#F2660F;margin:0 auto 15px;line-height:60px;font-size:30px;color:#ffffff;">&#9888;</div>
<h2 style="color:#121010;margin:0 0 10px;font-size:24px;">Order On Hold</h2>
</div>
<p style="color:#555;font-size:15px;margin:0 0 20px;text-align:center;">Hi {{ customer_name }},</p>
<p style="color:#555;font-size:15px;margin:0 0 25px;text-align:center;">Your order <strong>#{{ order_number }}</strong> is temporarily on hold. We'll update you shortly.</p>
<table cellpadding="0" cellspacing="0" style="margin:20px 0;"><tr><td style="background-color:#F2660F;border-radius:6px;"><a href="{{ order_url }}" style="display:inline-block;padding:14px 40px;color:#ffffff;text-decoration:none;font-weight:bold;font-size:16px;">View My Order</a></td></tr></table>
</td></tr>

<tr><td style="background-color:#F6F9F9;padding:30px 40px;text-align:center;border-top:1px solid #DBD2CB;border-radius:0 0 8px 8px;">
<p style="color:#999;font-size:12px;margin:0 0 5px;">&copy; {{ year }} {{ store_name }}. All rights reserved.</p>
<p style="color:#999;font-size:12px;margin:0;">This is a transactional email regarding your account.</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
