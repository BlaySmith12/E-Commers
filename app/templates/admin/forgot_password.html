{% extends "admin/auth_base.html" %}

{% block title %}Forgot Password — ASAH'S PRIMENEST{% endblock %}

{% block content %}
<div class="container-fluid px-3">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
            <div class="auth-card p-4 p-sm-5">
                <div class="auth-logo">
                    <a href="/" class="auth-logo-fallback">
                        <img src="/static/images/logo.png" alt="ASAH'S PRIMENEST"
                             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                        <div class="auth-logo-icon" style="display:none;">A</div>
                    </a>
                </div>

                <h1 class="auth-heading">Forgot Password?</h1>
                <p class="auth-subheading">Enter your email address and we'll send you a link to reset your password.</p>

                <!-- Success Message -->
                <div id="success-msg" class="auth-alert auth-alert-success d-none">
                    <i class="bi bi-check-circle-fill"></i>
                    <span id="success-text"></span>
                </div>

                <!-- Error Message -->
                <div id="forgot-error" class="auth-alert auth-alert-error d-none">
                    <i class="bi bi-exclamation-circle-fill"></i>
                    <span id="forgot-error-text"></span>
                </div>

                <!-- Request Form -->
                <form id="forgotForm" class="auth-form" novalidate>
                    <div class="mb-4">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="admin@primenest.com" required autocomplete="email">
                    </div>

                    <button type="submit" class="btn-auth" id="forgotBtn">
                        <span id="forgotBtnText">Send Reset Link</span>
                        <span id="forgotBtnSpinner" class="d-none">
                            <span class="spinner-border spinner-border-sm" role="status"></span>
                            Sending...
                        </span>
                    </button>
                </form>

                <div class="auth-links mt-3">
                    <a href="/admin/login" class="auth-link">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>

                <a href="/" class="auth-back-store d-block text-center mt-3">
                    <i class="bi bi-arrow-left"></i> Back to Store
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function() {
    const form = document.getElementById('forgotForm');
    const errEl = document.getElementById('forgot-error');
    const errText = document.getElementById('forgot-error-text');
    const succEl = document.getElementById('success-msg');
    const succText = document.getElementById('success-text');
    const btn = document.getElementById('forgotBtn');
    const btnText = document.getElementById('forgotBtnText');
    const btnSpinner = document.getElementById('forgotBtnSpinner');

    form.addEventListener('input', function() {
        errEl.classList.add('d-none');
        succEl.classList.add('d-none');
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errEl.classList.add('d-none');
        succEl.classList.add('d-none');

        const email = document.getElementById('email').value.trim();
        if (!email) {
            showError('Please enter your email address.');
            return;
        }

        btn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        try {
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await res.json();

            // Always show success (don't reveal if email exists)
            showSuccess('If an account with that email exists, you will receive a password reset link shortly. Please check your inbox.');
            form.reset();
        } catch (err) {
            showSuccess('If an account with that email exists, you will receive a password reset link shortly. Please check your inbox.');
            form.reset();
        }

        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
    });

    function showError(msg) {
        errText.textContent = msg;
        errEl.classList.remove('d-none');
    }
    function showSuccess(msg) {
        succText.textContent = msg;
        succEl.classList.remove('d-none');
    }
})();
</script>
{% endblock %}
