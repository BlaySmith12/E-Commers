{% extends "admin_base.html" %}
{% block head %}
<style>
    .notif-item { display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border-color); transition: background .15s; }
    .notif-item:hover { background: rgba(255,255,255,.02); }
    .notif-item.unread { background: rgba(242,102,15,.03); border-left: 3px solid var(--primary-orange); }
    .notif-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: .95rem; flex-shrink: 0; }
    .notif-content { flex: 1; min-width: 0; }
    .notif-title { font-size: .88rem; font-weight: 600; color: #F6F9F9; }
    .notif-msg { font-size: .8rem; color: #9a9590; margin-top: 2px; }
    .notif-time { font-size: .72rem; color: #6e6a66; margin-top: 4px; }
    .notif-actions { display: flex; gap: 6px; opacity: 0; transition: .2s; }
    .notif-item:hover .notif-actions { opacity: 1; }
    .notif-btn { background: none; border: none; color: #6e6a66; cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: .8rem; }
    .notif-btn:hover { color: #F6F9F9; background: rgba(255,255,255,.05); }
    .filter-tab { padding: 6px 16px; border-radius: 20px; font-size: .82rem; cursor: pointer; border: 1px solid var(--border-color); background: transparent; color: #9a9590; transition: .2s; }
    .filter-tab.active { background: var(--primary-orange); color: #fff; border-color: var(--primary-orange); }
    .empty-state { text-align: center; padding: 50px 20px; color: #9a9590; }
    .empty-state i { font-size: 3rem; opacity: .2; display: block; margin-bottom: 12px; }
</style>
{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Notifications</h3>
            <p style="color:#9a9590;margin:0;">Manage your notification center</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="markAllRead()"><i class="bi bi-check-all me-1"></i> Mark All Read</button>
    </div>

    <div class="d-flex gap-2 mb-3">
        <button class="filter-tab active" onclick="filterNotifs('all', this)">All</button>
        <button class="filter-tab" onclick="filterNotifs('unread', this)">Unread</button>
    </div>

    <div class="card card-custom overflow-hidden">
        <div id="notif-list"></div>
        <div id="empty-state" class="empty-state" style="display:none;">
            <i class="bi bi-bell-slash"></i>
            <p>No notifications yet</p>
        </div>
        <div id="loading" class="text-center py-4"><div class="spinner-border spinner-border-sm text-orange"></div></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const token = localStorage.getItem('admin_token');
if (!token) { window.location.href = '/admin/login'; }
const H = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
let currentFilter = 'all';

const iconMap = {
    info: '<i class="bi bi-info-circle" style="color:#0d6efd"></i>',
    success: '<i class="bi bi-check-circle" style="color:#198754"></i>',
    warning: '<i class="bi bi-exclamation-triangle" style="color:#ffc107"></i>',
    error: '<i class="bi bi-x-circle" style="color:#dc3545"></i>'
};
const bgMap = {
    info: 'rgba(13,110,253,.1)',
    success: 'rgba(25,135,84,.1)',
    warning: 'rgba(255,193,7,.1)',
    error: 'rgba(220,53,69,.1)'
};

function timeAgo(d) {
    if (!d) return '';
    const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
    if (s < 60) return 'Just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    if (s < 604800) return Math.floor(s/86400) + 'd ago';
    return new Date(d).toLocaleDateString();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

async function loadNotifs() {
    const url = currentFilter === 'unread' ? '/api/notifications?unread_only=true&limit=50' : '/api/notifications?limit=50';
    const r = await fetch(url, { headers: H });
    if (r.status === 401) { window.location.href = '/admin/login'; return; }
    const data = await r.json();
    document.getElementById('loading').style.display = 'none';
    const list = document.getElementById('notif-list');
    const empty = document.getElementById('empty-state');
    list.innerHTML = '';
    if (!data || data.length === 0) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    list.innerHTML = data.map(n => `
        <div class="notif-item ${n.is_read ? '' : 'unread'}" id="notif-${n.id}">
            <div class="notif-icon" style="background:${bgMap[n.type]||bgMap.info}">${iconMap[n.type]||iconMap.info}</div>
            <div class="notif-content">
                <div class="notif-title">${esc(n.title)}</div>
                <div class="notif-msg">${esc(n.message||'')}</div>
                <div class="notif-time">${timeAgo(n.created_at)}</div>
            </div>
            <div class="notif-actions">
                ${!n.is_read ? `<button class="notif-btn" onclick="markRead(${n.id})" title="Mark read"><i class="bi bi-check2"></i></button>` : ''}
                <button class="notif-btn" onclick="deleteNotif(${n.id})" title="Delete"><i class="bi bi-trash3"></i></button>
            </div>
        </div>
    `).join('');
}

function filterNotifs(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('loading').style.display = 'block';
    loadNotifs();
}

async function markRead(id) {
    await fetch(`/api/notifications/${id}/read`, { method: 'PATCH', headers: H });
    const el = document.getElementById(`notif-${id}`);
    if (el) el.classList.remove('unread');
}

async function deleteNotif(id) {
    await fetch(`/api/notifications/${id}`, { method: 'DELETE', headers: H });
    const el = document.getElementById(`notif-${id}`);
    if (el) el.remove();
}

async function markAllRead() {
    await fetch('/api/notifications/read-all', { method: 'PATCH', headers: H });
    document.querySelectorAll('.notif-item.unread').forEach(el => el.classList.remove('unread'));
}

loadNotifs();
</script>
{% endblock %}
