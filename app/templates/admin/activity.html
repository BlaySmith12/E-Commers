{% extends "admin_base.html" %}
{% block head %}
<style>
    .act-timeline { position: relative; padding-left: 30px; }
    .act-timeline::before { content: ''; position: absolute; left: 12px; top: 0; bottom: 0; width: 2px; background: var(--border-color); }
    .act-item { position: relative; padding: 0 0 24px 0; }
    .act-dot { position: absolute; left: -24px; top: 4px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--border-color); background: var(--bg-panel); z-index: 1; }
    .act-dot.order_created, .act-dot.payment_completed { border-color: #198754; background: #198754; }
    .act-dot.order_status_changed { border-color: #0dcaf0; background: #0dcaf0; }
    .act-dot.payment_failed, .act-dot.order_cancelled, .act-dot.product_deleted { border-color: #dc3545; background: #dc3545; }
    .act-dot.customer_registered { border-color: #0d6efd; background: #0d6efd; }
    .act-dot.product_created { border-color: #198754; background: #198754; }
    .act-dot.product_updated { border-color: #ffc107; background: #ffc107; }
    .act-dot.coupon_used { border-color: #6f42c1; background: #6f42c1; }
    .act-dot.loyalty_points_earned, .act-dot.loyalty_points_redeemed { border-color: #ffc107; background: #ffc107; }
    .act-action { font-size: .9rem; color: var(--text-primary); font-weight: 500; }
    .act-details { font-size: .8rem; color: var(--text-muted); margin-top: 3px; }
    .act-time { font-size: .72rem; color: var(--text-dim); margin-top: 4px; }
    .act-link { color: var(--primary-orange); text-decoration: none; }
    .act-link:hover { text-decoration: underline; }
</style>
{% endblock %}
{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-1">Activity Log</h3>
            <p style="color:var(--text-muted);margin:0;">Track all real application events and changes</p>
        </div>
        <a href="/admin" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
    </div>

    <div class="card card-custom p-4">
        <div id="activity-list" class="act-timeline">
            <div class="text-center py-4"><div class="spinner-border spinner-border-sm text-orange"></div></div>
        </div>
        <div class="text-center mt-3">
            <button class="btn btn-sm btn-outline-secondary" id="load-more-btn" style="display:none;" onclick="loadMore()">Load More</button>
        </div>
        <div id="empty-state" class="text-center py-5" style="display:none;">
            <i class="bi bi-clock-history" style="font-size:3rem;color:var(--text-dim);opacity:.3;"></i>
            <p style="color:var(--text-muted);margin-top:12px;">No activity recorded yet</p>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const token = localStorage.getItem('admin_token');
if (!token) { window.location.href = '/admin/login'; }
const H = { 'Authorization': `Bearer ${token}` };
let offset = 0; const limit = 30;

const LINK_MAP = {
    'order_created': '/admin/orders/edit/',
    'payment_completed': '/admin/orders/edit/',
    'payment_failed': '/admin/orders/edit/',
    'order_status_changed': '/admin/orders/edit/',
    'order_cancelled': '/admin/orders/edit/',
    'customer_registered': '/admin/customers/',
    'product_created': '/admin/products/edit/',
    'product_updated': '/admin/products/edit/',
    'product_deleted': '/admin/products/',
};

function timeAgo(d) {
    if (!d) return '';
    const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
    if (s < 60) return 'Just now';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    if (s < 604800) return Math.floor(s/86400) + 'd ago';
    return new Date(d).toLocaleDateString();
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function loadActivities(reset) {
    if (reset) { offset = 0; document.getElementById('activity-list').innerHTML = ''; }
    const r = await fetch(`/api/analytics/activity?limit=${limit}&offset=${offset}`, { headers: H });
    if (r.status === 401) { window.location.href = '/admin/login'; return; }
    if (!r.ok) { document.getElementById('activity-list').innerHTML = '<p class="text-center py-4" style="color:var(--text-muted);">Failed to load activities.</p>'; return; }
    const data = await r.json();
    const activities = data.activities || [];
    const list = document.getElementById('activity-list');
    const empty = document.getElementById('empty-state');
    const moreBtn = document.getElementById('load-more-btn');

    if (offset === 0 && activities.length === 0) {
        list.innerHTML = '';
        empty.style.display = 'block';
        return;
    }
    empty.style.display = 'none';

    const items = activities.map(a => {
        const link = LINK_MAP[a.activity_type] && a.entity_id ? LINK_MAP[a.activity_type] + a.entity_id : null;
        return `
        <div class="act-item">
            <div class="act-dot ${escapeHtml(a.activity_type)}"></div>
            <div class="act-action">${link ? '<a class="act-link" href="' + link + '">' + escapeHtml(a.description) + '</a>' : escapeHtml(a.description)}</div>
            ${a.entity_number ? `<div class="act-details">${escapeHtml(a.entity_type || '')} #${escapeHtml(a.entity_number)}</div>` : ''}
            <div class="act-time">${timeAgo(a.created_at)}</div>
        </div>`;
    }).join('');
    list.insertAdjacentHTML('beforeend', items);

    moreBtn.style.display = activities.length >= limit ? 'inline-block' : 'none';
    offset += activities.length;
}

function loadMore() { loadActivities(false); }

loadActivities(true);
</script>
{% endblock %}
