{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="fade-up">
            <div class="card card-custom p-4 p-md-5 border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white mb-2">Reset Password</h2>
                    <p class="text-warm-gray">Enter your new password below.</p>
                </div>

                <div id="reset-error" class="alert alert-danger d-none mb-3"></div>
                <div id="reset-success" class="alert alert-success d-none mb-3"></div>

                <!-- Expired token message -->
                <div id="token-expired" class="d-none text-center py-4">
                    <i class="bi bi-clock-history" style="font-size:3rem;color:var(--primary-orange);opacity:0.5;display:block;margin-bottom:12px;"></i>
                    <h5 class="text-white mb-2">Link Expired</h5>
                    <p class="text-warm-gray" style="font-size:0.9rem;">This password reset link has expired or is invalid.</p>
                    <a href="/forgot-password" class="btn btn-primary mt-3">Request New Link</a>
                </div>

                <form id="resetForm">
                    <input type="hidden" id="resetToken" value="{{ token }}">

                    <div class="mb-3">
                        <label class="form-label text-warm-gray" for="newPassword">New Password</label>
                        <input type="password" class="form-control form-control-custom" id="newPassword" name="newPassword"
                               placeholder="Enter new password" required minlength="8">
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-warm-gray" for="confirmPassword">Confirm Password</label>
                        <input type="password" class="form-control form-control-custom" id="confirmPassword" name="confirmPassword"
                               placeholder="Confirm new password" required minlength="8">
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg" id="resetBtn">
                            <span id="resetBtnText">Reset Password</span>
                            <span id="resetBtnSpinner" class="d-none">
                                <span class="spinner-border spinner-border-sm" role="status"></span>
                                Resetting...
                            </span>
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <a href="/login" class="text-primary-orange text-decoration-none small">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const token = document.getElementById('resetToken').value;
    if (!token) {
        document.getElementById('resetForm').classList.add('d-none');
        document.getElementById('token-expired').classList.remove('d-none');
        return;
    }

    const form = document.getElementById('resetForm');
    const errEl = document.getElementById('reset-error');
    const succEl = document.getElementById('reset-success');
    const btn = document.getElementById('resetBtn');
    const btnText = document.getElementById('resetBtnText');
    const btnSpinner = document.getElementById('resetBtnSpinner');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errEl.classList.add('d-none');
        succEl.classList.add('d-none');

        const pw = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (pw.length < 8) {
            errEl.textContent = 'Password must be at least 8 characters long.';
            errEl.classList.remove('d-none');
            return;
        }
        if (!/[A-Z]/.test(pw) || !/[a-z]/.test(pw) || !/[0-9]/.test(pw)) {
            errEl.textContent = 'Password must contain at least one uppercase letter, one lowercase letter, and one digit.';
            errEl.classList.remove('d-none');
            return;
        }
        if (pw !== confirm) {
            errEl.textContent = 'Passwords do not match.';
            errEl.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, password: pw })
            });

            const data = await res.json();

            if (res.ok) {
                succEl.textContent = 'Password reset successfully! Redirecting to login...';
                succEl.classList.remove('d-none');
                form.classList.add('d-none');
                setTimeout(function() { window.location.href = '/login'; }, 2500);
            } else {
                if (data.detail && data.detail.includes('expired')) {
                    form.classList.add('d-none');
                    document.getElementById('token-expired').classList.remove('d-none');
                } else {
                    errEl.textContent = data.detail || 'Unable to reset password. Please try again.';
                    errEl.classList.remove('d-none');
                }
            }
        } catch (err) {
            errEl.textContent = 'Connection error. Please try again.';
            errEl.classList.remove('d-none');
        }

        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
    });
})();
</script>
{% endblock %}
