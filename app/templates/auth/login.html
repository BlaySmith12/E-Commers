{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="fade-up">
            <div class="card card-custom p-4 p-md-5 border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white mb-2">Welcome Back</h2>
                    <p class="text-warm-gray">Sign in to your premium account</p>
                </div>
                
                <form id="loginForm" onsubmit="return handleLogin(event)">
                    
                    <div class="mb-3">
                        <label class="form-label text-warm-gray" for="email">Email</label>
                        <input type="email" class="form-control form-control-custom" id="email" name="username" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-warm-gray" for="password">Password</label>
                        <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input custom-checkbox" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label text-warm-gray" for="remember">Remember Me</label>
                        </div>
                        <a href="/forgot-password" class="text-primary-orange text-decoration-none small">Forgot Password?</a>
                    </div>
                    
                    <div id="loginError" class="alert alert-danger d-none mb-3"></div>
                    <div id="loginSuccess" class="alert alert-success d-none mb-3"></div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>
                
                <script>
                async function handleLogin(e) {
                    e.preventDefault();
                    const errDiv = document.getElementById('loginError');
                    const successDiv = document.getElementById('loginSuccess');
                    errDiv.classList.add('d-none');
                    successDiv.classList.add('d-none');
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: document.getElementById('email').value,
                                password: document.getElementById('password').value,
                                remember_me: document.getElementById('remember').checked
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            errDiv.textContent = data.detail || 'Login failed';
                            errDiv.classList.remove('d-none');
                            return false;
                        }
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        successDiv.textContent = 'Login successful! Redirecting...';
                        successDiv.classList.remove('d-none');
                        setTimeout(function() { window.location.href = '/'; }, 1500);
                    } catch (err) {
                        errDiv.textContent = 'An error occurred. Please try again.';
                        errDiv.classList.remove('d-none');
                    }
                    return false;
                }
                </script>
                
                <div class="text-center mt-4">
                    <p class="text-warm-gray mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary-orange text-decoration-none fw-bold">Sign Up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .custom-checkbox {
        background-color: transparent;
        border-color: rgba(255,255,255,0.2);
    }
    .custom-checkbox:checked {
        background-color: var(--primary-orange);
        border-color: var(--primary-orange);
    }
</style>
{% endblock %}
