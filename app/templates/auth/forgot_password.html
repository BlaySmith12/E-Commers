{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="fade-up">
            <div class="card card-custom p-4 p-md-5 border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white mb-2">Forgot Password?</h2>
                    <p class="text-warm-gray">Enter your email address and we'll send you a link to reset your password.</p>
                </div>

                <!-- Success Message -->
                <div id="success-msg" class="alert alert-success d-none mb-3"></div>

                <!-- Error Message -->
                <div id="forgot-error" class="alert alert-danger d-none mb-3"></div>

                <form id="forgotForm">
                    <div class="mb-4">
                        <label class="form-label text-warm-gray" for="email">Email Address</label>
                        <input type="email" class="form-control form-control-custom" id="email" name="email"
                               placeholder="name@example.com" required autocomplete="email">
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg" id="forgotBtn">
                            <span id="forgotBtnText">Send Reset Link</span>
                            <span id="forgotBtnSpinner" class="d-none">
                                <span class="spinner-border spinner-border-sm" role="status"></span>
                                Sending...
                            </span>
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <a href="/login" class="text-primary-orange text-decoration-none small">
                        <i class="bi bi-arrow-left"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const form = document.getElementById('forgotForm');
    const errEl = document.getElementById('forgot-error');
    const succEl = document.getElementById('success-msg');
    const btn = document.getElementById('forgotBtn');
    const btnText = document.getElementById('forgotBtnText');
    const btnSpinner = document.getElementById('forgotBtnSpinner');

    form.addEventListener('input', function() {
        errEl.classList.add('d-none');
        succEl.classList.add('d-none');
    });

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        errEl.classList.add('d-none');
        succEl.classList.add('d-none');

        const email = document.getElementById('email').value.trim();
        if (!email) {
            errEl.textContent = 'Please enter your email address.';
            errEl.classList.remove('d-none');
            return;
        }

        btn.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');

        try {
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await res.json();

            // Always show success (don't reveal if email exists)
            succEl.textContent = 'If an account with that email exists, you will receive a password reset link shortly. Please check your inbox.';
            succEl.classList.remove('d-none');
            form.reset();
        } catch (err) {
            succEl.textContent = 'If an account with that email exists, you will receive a password reset link shortly. Please check your inbox.';
            succEl.classList.remove('d-none');
            form.reset();
        }

        btn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
    });
})();
</script>
{% endblock %}
