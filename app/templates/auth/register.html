{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-aos="fade-up">
            <div class="card card-custom p-4 p-md-5 border-0">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-white mb-2">Create Account</h2>
                    <p class="text-warm-gray">Join ASAH'S PRIMENEST today</p>
                </div>
                
                <form id="registerForm" onsubmit="return handleRegister(event)">
                    
                    <div class="mb-3">
                        <label class="form-label text-warm-gray" for="username">Username</label>
                        <input type="text" class="form-control form-control-custom" id="username" name="username" placeholder="johndoe" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-warm-gray" for="email">Email</label>
                        <input type="email" class="form-control form-control-custom" id="email" name="email" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-warm-gray" for="password">Password</label>
                        <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label text-warm-gray" for="confirm_password">Confirm Password</label>
                        <input type="password" class="form-control form-control-custom" id="confirm_password" name="confirm_password" placeholder="••••••••" required>
                    </div>
                    
                    <div id="registerError" class="alert alert-danger d-none mb-3"></div>
                    <div id="registerSuccess" class="alert alert-success d-none mb-3"></div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                    </div>
                </form>
                
                <script>
                async function handleRegister(e) {
                    e.preventDefault();
                    const errDiv = document.getElementById('registerError');
                    const successDiv = document.getElementById('registerSuccess');
                    errDiv.classList.add('d-none');
                    successDiv.classList.add('d-none');
                    try {
                        const res = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: document.getElementById('username').value,
                                email: document.getElementById('email').value,
                                password: document.getElementById('password').value,
                                confirm_password: document.getElementById('confirm_password').value
                            })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            errDiv.textContent = data.detail || 'Registration failed';
                            errDiv.classList.remove('d-none');
                            return false;
                        }
                        localStorage.setItem('token', data.access_token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                        successDiv.textContent = 'Account created successfully! Redirecting...';
                        successDiv.classList.remove('d-none');
                        setTimeout(function() { window.location.href = '/'; }, 1500);
                    } catch (err) {
                        errDiv.textContent = 'An error occurred. Please try again.';
                        errDiv.classList.remove('d-none');
                    }
                    return false;
                }
                </script>
                
                <div class="text-center">
                    <p class="text-warm-gray mb-0">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary-orange text-decoration-none fw-bold">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
